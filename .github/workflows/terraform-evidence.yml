
name: Terraform Policy CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-validation:
    name: Terraform and Policy Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.71.1"
          ARCHIVE="conftest_${VERSION}_Linux_x86_64.tar.gz"
          RELEASE_URL="https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}"

          curl -fsSLO "${RELEASE_URL}/${ARCHIVE}"
          curl -fsSLO "${RELEASE_URL}/checksums.txt"

          awk -v archive="$ARCHIVE" '$2 == archive' checksums.txt | sha256sum --check

          tar -xzf "${ARCHIVE}" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest

          conftest --version

      - name: Verify tool versions
        run: |
          terraform version
          conftest --version

      - name: Run network policy unit tests
        run: |
          conftest verify --policy policies/network

      - name: Initialize Terraform
        working-directory: examples/phase-2-schema-lab
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: examples/phase-2-schema-lab
        run: |
          terraform validate -no-color

      - name: Generate Terraform plan and evaluate policies
        working-directory: examples/phase-2-schema-lab
        shell: bash
        run: |
          set -euo pipefail

          trap 'rm -f tfplan tfplan.json conftest-results.json' EXIT

          terraform plan \
            -refresh=false \
            -input=false \
            -no-color \
            -out=tfplan

          terraform show -json tfplan > tfplan.json

          jq -c '
          .resource_changes[]
          | select(
              (.address == "aws_security_group.inline")
              or (.address | test("rdp"; "i"))
            )
          | {
              address,
              type,
              actions: .change.actions,
              after: (
                if .type == "aws_security_group" then
                  [
                    .change.after.ingress[]
                    | select(.from_port <= 3389 and .to_port >= 3389)
                    | {
                        protocol,
                        from_port,
                        to_port,
                        cidr_blocks,
                        ipv6_cidr_blocks
                      }
                  ]
                else
                  {
                    protocol: (.change.after.protocol // .change.after.ip_protocol),
                    from_port: .change.after.from_port,
                    to_port: .change.after.to_port,
                    cidr_blocks: .change.after.cidr_blocks,
                    ipv6_cidr_blocks: .change.after.ipv6_cidr_blocks,
                    cidr_ipv4: .change.after.cidr_ipv4,
                    cidr_ipv6: .change.after.cidr_ipv6
                  }
                end
              ),
              after_unknown: .change.after_unknown
            }
          ' tfplan.json

          set +e
          conftest test tfplan.json \
            --policy ../../policies/network \
            --output json > conftest-results.json
          conftest_status=$?
          set -e

          cat conftest-results.json

          # Conftest must reject the insecure plan.
          if [ "$conftest_status" -eq 0 ]; then
            echo "ERROR: Expected RDP policy violations, but Conftest passed."
            exit 1
          fi

          # Exactly six AWS-NET-002 violations must be reported.
          jq -e '
            [.[] | (.failures // [])[]] as $failures
            | ($failures | length == 6)
              and (
                [$failures[] |
                  select((.metadata.policy_id // .policy_id) == "AWS-NET-002")
                ] | length == 6
              )
          ' conftest-results.json

          echo "PASS: All six unrestricted RDP exposures were detected."
