
name: Terraform Policy CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-validation:
    name: Terraform and Policy Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.71.1"
          ARCHIVE="conftest_${VERSION}_Linux_x86_64.tar.gz"
          RELEASE_URL="https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}"

          curl -fsSLO "${RELEASE_URL}/${ARCHIVE}"
          curl -fsSLO "${RELEASE_URL}/checksums.txt"

          awk -v archive="$ARCHIVE" '$2 == archive' checksums.txt | sha256sum --check

          tar -xzf "${ARCHIVE}" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest

          conftest --version

      - name: Verify tool versions
        run: |
          terraform version
          conftest --version

      - name: Run network policy unit tests
        run: |
          conftest verify --policy policies/network

      - name: Initialize Terraform
        working-directory: examples/phase-2-schema-lab
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -lockfile=readonly

      - name: Inspect S3 security schema
        working-directory: examples/phase-2-schema-lab
        shell: bash
        run: |
          terraform providers schema -json |
            jq '
              .provider_schemas["registry.terraform.io/hashicorp/aws"].resource_schemas
              | with_entries(
                  select(
                    .key as $key
                    | [
                        "aws_s3_bucket",
                        "aws_s3_bucket_acl",
                        "aws_s3_bucket_policy",
                        "aws_s3_bucket_public_access_block",
                        "aws_s3_account_public_access_block",
                        "aws_s3_access_point"
                      ]
                    | index($key)
                  )
                )
              | with_entries(
                  .value = {
                    attributes: (
                      (.value.block.attributes // {})
                      | with_entries(
                          select(
                            .key as $key
                            | [
                                "acl",
                                "bucket",
                                "policy",
                                "block_public_acls",
                                "ignore_public_acls",
                                "block_public_policy",
                                "restrict_public_buckets"
                              ]
                            | index($key)
                          )
                        )
                    ),
                    block_types: (.value.block.block_types // {})
                  }
                )
            '

      - name: Validate Terraform configuration
        working-directory: examples/phase-2-schema-lab
        run: |
          terraform validate -no-color

      - name: Generate Terraform plan and evaluate policies
        working-directory: examples/phase-2-schema-lab
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -refresh=false \
            -input=false \
            -no-color \
            -out=tfplan

          terraform show -json tfplan > tfplan.json

          echo "Database ingress rules in Terraform plan:"

          jq -c '
            .resource_changes[]
            | select(
                .address == "aws_security_group.inline"
                or (.address | test("postgres|mysql|sqlserver"; "i"))
              )
            | {
                address,
                type,
                actions: .change.actions,
                after: (
                  if .type == "aws_security_group" then
                    [
                      (.change.after.ingress // [])[]
                      | select(
                          .from_port as $from
                          | .to_port as $to
                          | any(
                              [1433, 3306, 5432][];
                              . >= $from and . <= $to
                            )
                        )
                      | {
                          protocol,
                          from_port,
                          to_port,
                          cidr_blocks,
                          ipv6_cidr_blocks
                        }
                    ]
                  else
                    {
                      protocol: (
                        .change.after.protocol
                        // .change.after.ip_protocol
                      ),
                      from_port: .change.after.from_port,
                      to_port: .change.after.to_port,
                      cidr_blocks: .change.after.cidr_blocks,
                      ipv6_cidr_blocks: .change.after.ipv6_cidr_blocks,
                      cidr_ipv4: .change.after.cidr_ipv4,
                      cidr_ipv6: .change.after.cidr_ipv6
                    }
                  end
                ),
                after_unknown: .change.after_unknown
              }
          ' tfplan.json


          echo "Running Conftest positive integration test..."

          # Capture Conftest output and exit status without stopping the step.
          set +e
          conftest test tfplan.json \
            --policy ../../policies/network \
            --output json > conftest-results.json
          CONFTEST_EXIT_CODE=$?
          set -e

          echo "Conftest exit code: ${CONFTEST_EXIT_CODE}"

          # Exit code 1 is expected for policy denials.
          # Any other exit code indicates an unexpected result.
          if [ "${CONFTEST_EXIT_CODE}" -ne 1 ]; then
            echo "::error::Expected Conftest policy-denial exit code 1, received ${CONFTEST_EXIT_CODE}."
            cat conftest-results.json
            exit 1
          fi

          # Validate that Conftest produced valid JSON results.
          if ! jq -e 'type == "array" and length > 0' \
            conftest-results.json > /dev/null; then
            echo "::error::Conftest produced invalid or empty JSON output."
            cat conftest-results.json
            exit 1
          fi

          # Rego evaluation exceptions are never expected.
          EXCEPTION_COUNT=$(jq '
            [.[] | (.exceptions // [])[]] | length
          ' conftest-results.json)

          if [ "${EXCEPTION_COUNT}" -ne 0 ]; then
            echo "::error::Conftest reported ${EXCEPTION_COUNT} evaluation exceptions."
            jq . conftest-results.json
            exit 1
          fi

          # Extract AWS-NET-004 canonical violation metadata.
          NET004_RESULTS=$(jq '
            [
              .[]
              | (.failures // [])[]
              | select(.metadata.policy_id? == "AWS-NET-004")
              | .metadata
            ]
          ' conftest-results.json)

          echo "AWS-NET-004 findings:"
          echo "${NET004_RESULTS}" | jq .

          # Verify the expected violation count.
          ACTUAL_COUNT=$(echo "${NET004_RESULTS}" | jq 'length')
          EXPECTED_COUNT=5

          if [ "${ACTUAL_COUNT}" -ne "${EXPECTED_COUNT}" ]; then
            echo "::error::Expected ${EXPECTED_COUNT} AWS-NET-004 violations, found ${ACTUAL_COUNT}."
            exit 1
          fi

          # Verify every expected Terraform resource address.
          for RESOURCE in \
            "aws_s3_bucket_acl.net004_acl" \
            "aws_s3_bucket_policy.net004_policy" \
            "aws_s3_bucket_public_access_block.net004_acl" \
            "aws_s3_bucket_public_access_block.net004_policy" \
            "aws_s3_account_public_access_block.net004"
          do
            if ! echo "${NET004_RESULTS}" | jq -e \
              --arg resource "${RESOURCE}" \
              'any(.[]; .resource == $resource)' > /dev/null; then
              echo "::error::Expected violation missing for ${RESOURCE}."
              exit 1
            fi
          done

          echo "Positive integration test passed."


          rm -f tfplan

      - name: Upload Terraform plan JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-json
          path: examples/phase-2-schema-lab/tfplan.json
          if-no-files-found: warn
          retention-days: 2
